<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Signal — One idea. Make it count.</title><desc id="desc">An original green and charcoal typographic poster designed for Rahul Rachhoya's portfolio.</desc><rect width="1080" height="1350" fill="#d2ed87"/><g fill="#223a2b"><text x="85" y="100" font-family="Arial,sans-serif" font-size="19" letter-spacing="5">SIGNAL / 001</text><text x="995" y="100" text-anchor="end" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">DESIGN STUDY</text><path d="M85 140H995" stroke="#223a2b" stroke-width="2"/><text x="72" y="390" font-family="Arial,sans-serif" font-size="160" letter-spacing="-10">One idea.</text><text x="79" y="565" font-family="Georgia,serif" font-size="164" font-style="italic" letter-spacing="-8">Make it</text><text x="76" y="738" font-family="Georgia,serif" font-size="180" font-style="italic" letter-spacing="-9">count.</text><g transform="translate(670 862)" stroke="#223a2b" stroke-width="20" fill="none"><path d="M0 200 200 0M0 0h200v200"/></g><text x="85" y="1134" font-family="Arial,sans-serif" font-size="23">A little less noise.</text><text x="85" y="1174" font-family="Arial,sans-serif" font-size="23">A little more intention.</text><path d="M85 1230H995" stroke="#223a2b" stroke-width="2"/><text x="85" y="1287" font-family="Arial,sans-serif" font-size="16" letter-spacing="4">ORIGINAL CONCEPT / RAHUL RACHHOYA</text><text x="995" y="1287" text-anchor="end" font-family="Arial,sans-serif" font-size="16">01</text></g></svg>
